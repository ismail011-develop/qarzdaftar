const opRow=o=>`<div class="row"><div class="av" style="background:${o.k=="pay"?"":"#5a1d26"}">${ic(o.k=="pay"?"down":"up",16)}</div><div class="grow"><b>${esc(o.c)}</b><small>${esc(o.n)} · ${o.d}${o.v?" · bekor qilingan":""}</small></div><div class="amt ${o.k=="pay"?"pos":"neg"}" style="${o.v?"text-decoration:line-through;opacity:.5":""}">${o.k=="pay"?"+":"−"}${fmt(o.a)}</div></div>`;
const clRows=()=>{const q=S.q.toLowerCase();const l=S.clients.filter(c=>c.name.toLowerCase().includes(q)||c.phone.replace(/\s/g,"").includes(q.replace(/\s/g,"")));return l.length?l.map(c=>{const r=debtOf(c.id).reduce((s,d)=>s+rem(d),0),o=debtOf(c.id).some(od);return`<div class="row cl" data-a="client" data-v="${c.id}"><div class="av">${ini(c.name)}</div><div class="grow"><b>${esc(c.name)}</b><small>${esc(c.phone)}</small></div><div class="amt ${o?"neg":r?"":"pos"}">${r?fmt(r):"Qarz yoʻq"}<small>${o?"muddati oʻtgan":""}</small></div></div>`}).join(""):`<p style="color:var(--m);padding:16px;text-align:center">Mijoz topilmadi</p>`};
const debtRow=d=>`<div class="row cl" data-a="debt" data-v="${d.id}"><div class="av">${ini(cl(d.cid).name)}</div><div class="grow"><b>${esc(cl(d.cid).name)}</b><small>${esc(d.note)} · muddat ${d.due}</small><div class="bar" style="margin-top:6px"><i style="width:${paidOf(d)/d.amount*100}%"></i></div></div><div class="amt">${fmt(rem(d))}<small>${status(d)}</small></div></div>`;

function store(){const v=S.view,t=totals();let h="";const hd=(ti,back)=>`<div class="h">${back?`<button class="ib" data-a="go" data-v="${back}">${ic("back")}</button>`:`<div></div>`}<h2>${ti}</h2><button class="ib" data-a="go" data-v="notif">${ic("bell")}<span class="dot"></span></button></div>`;
if(v=="home"){const[V,L]=wk();h=`<div class="h"><div><small style="color:var(--m)">Xayrli kun,</small><h2>Baraka Market</h2></div><button class="ib" data-a="go" data-v="notif">${ic("bell")}<span class="dot"></span></button></div>
<div class="hero"><small>Umumiy qarzdorlik</small><div class="big">${fmt(t.tot)}</div><small>Qaytarilgan: ${fmt(t.pd)}</small></div>
<div class="grid3"><div class="mini"><small>Mijozlar</small><b>${S.clients.length}</b></div><div class="mini"><small>Muddati oʻtgan</small><b class="neg">${t.ovn}</b></div><div class="mini"><small>Faol qarz</small><b>${S.debts.filter(d=>rem(d)>0).length}</b></div></div>
<div class="card"><h3>Qarzlar taqsimoti</h3><div style="display:flex;align-items:center;gap:14px">${donut([t.pd,t.tot-t.ov,t.ov],["#22e07a","#0e8f5a","#ff5d6c"])}<div style="font-size:13px;line-height:1.9"><span class="pos">●</span> Qaytarilgan<br><span style="color:#0e8f5a">●</span> Faol qoldiq<br><span class="neg">●</span> Muddati oʻtgan</div></div></div>
<div class="card"><h3>Oxirgi 7 kun: tushumlar</h3>${line(V,L)}</div>
<div class="card"><h3>Yaqin muddatlar</h3>${S.debts.filter(d=>rem(d)>0&&dd(d.due,T)>=0&&dd(d.due,T)<=5).sort((a,b)=>a.due.localeCompare(b.due)).map(debtRow).join("")||"<small>Yoʻq</small>"}</div>
<div class="card"><h3>Oxirgi operatsiyalar <a data-a="go" data-v="ops" style="color:var(--g);cursor:pointer">Barchasi</a></h3>${opsList().slice(0,4).map(opRow).join("")}</div>`}
else if(v=="clients")h=hd("Mijozlar")+`<input id="q" placeholder="Ism yoki telefon bilan qidirish" value="${esc(S.q)}"><div class="card" id="cl">${clRows()}</div><button class="fab" data-a="addClient">+</button>`;
else if(v=="client"){const c=cl(S.cid),ds=debtOf(c.id);h=hd("Mijoz","clients")+`<div class="card" style="text-align:center"><div class="av" style="width:64px;height:64px;margin:0 auto 8px;font-size:22px">${ini(c.name)}</div><b>${esc(c.name)}</b><br><small style="color:var(--m)">${esc(c.phone)}</small><div class="big" style="font-size:24px;font-weight:800;margin:10px 0">${fmt(ds.reduce((s,d)=>s+rem(d),0))}</div><div style="display:flex;gap:8px"><button class="btn w s" data-a="addDebt" data-v="${c.id}">+ Qarz</button><button class="btn o w s" data-a="remind" data-v="${c.id}">Eslatma (SMS)</button></div></div><div class="card"><h3>Qarzlar tarixi</h3>${ds.map(debtRow).join("")||"<small>Qarz yoʻq</small>"}</div><div class="card"><h3>Toʻlovlar tarixi</h3>${opsList().filter(o=>o.c==c.name).map(opRow).join("")}</div>`}
else if(v=="debts"){const l=S.debts.filter(d=>S.fl=="all"||(S.fl=="open"&&rem(d)>0&&!od(d))||(S.fl=="over"&&od(d))||(S.fl=="closed"&&rem(d)<=0));h=hd("Qarzlar")+`<div class="chips">${[["all","Hammasi"],["open","Faol"],["over","Muddati oʻtgan"],["closed","Yopilgan"]].map(x=>`<button class="chip ${S.fl==x[0]?"on":""}" data-a="fl" data-v="${x[0]}">${x[1]}</button>`).join("")}</div><div class="card">${l.map(debtRow).join("")||"<small>Yoʻq</small>"}</div><button class="fab" data-a="addDebt">+</button>`}
else if(v=="debtd"){const d=S.debts.find(x=>x.id==S.did),c=cl(d.cid);h=hd("Qarz tafsiloti","debts")+`<div class="hero"><small>${esc(c.name)} · ${esc(d.note)}</small><div class="big">${fmt(rem(d))}</div><small>${fmt(d.amount)} dan ${fmt(paidOf(d))} toʻlangan</small><div class="bar" style="margin-top:10px"><i style="width:${paidOf(d)/d.amount*100}%"></i></div></div><div class="card"><div style="display:flex;justify-content:space-between;font-size:13px;color:var(--m)"><span>Yaratilgan: ${d.date}</span><span>Muddat: ${d.due}</span></div><div style="margin:8px 0">${status(d)} ${d.ed?`<span class="tag x">tahrirlangan ×${d.ed}</span>`:""}</div><div style="display:flex;gap:8px"><button class="btn w s" data-a="pay" data-v="${d.id}" ${rem(d)<=0?"disabled style=opacity:.4":""}>Toʻlov yozish</button><button class="btn o w s" data-a="editDebt" data-v="${d.id}">Tahrirlash</button></div></div><div class="card"><h3>Toʻlovlar</h3>${d.pays.map(p=>`<div class="row"><div class="grow"><b style="${p.void?"text-decoration:line-through;opacity:.5":""}">${fmt(p.amt)}</b><small>${p.date}${p.void?" · bekor (tarixda saqlangan)":""}</small></div>${p.void?"":`<button class="btn d s" data-a="void" data-v="${d.id}:${p.id}">Bekor</button>`}</div>`).join("")||"<small>Hali toʻlov yoʻq</small>"}</div>`}
else if(v=="ops"){const o=opsList().filter(x=>S.ops=="all"||x.k==S.ops);h=hd("Operatsiyalar","home")+`<div class="chips">${[["all","Hammasi"],["debt","Qarzlar"],["pay","Toʻlovlar"]].map(x=>`<button class="chip ${S.ops==x[0]?"on":""}" data-a="opf" data-v="${x[0]}">${x[1]}</button>`).join("")}</div><div class="card">${o.map(opRow).join("")}</div>`}
else if(v=="stats"){const[V,L]=wk();const top=S.clients.map(c=>({c,n:debtOf(c.id).length,s:debtOf(c.id).reduce((a,d)=>a+d.amount,0)})).sort((a,b)=>b.s-a.s).slice(0,4);h=hd("Statistika")+`<div class="grid3"><div class="mini"><small>Jami berilgan</small><b style="font-size:12px">${fmt(t.all)}</b></div><div class="mini"><small>Qaytgan</small><b class="pos" style="font-size:12px">${fmt(t.pd)}</b></div><div class="mini"><small>Qoldiq</small><b style="font-size:12px">${fmt(t.tot)}</b></div></div><div class="card"><h3>Tushumlar (7 kun)</h3>${bars(V.map(x=>Math.round(x/1000)),L,"k")}</div><div class="card"><h3>Qaytarish darajasi</h3><div class="bar"><i style="width:${t.pd/t.all*100}%"></i></div><small style="color:var(--m)">${Math.round(t.pd/t.all*100)}% qaytarilgan · muddati oʻtgan: ${fmt(t.ov)}</small></div><div class="card"><h3>Eng faol mijozlar</h3>${top.map(x=>`<div class="row"><div class="av">${ini(x.c.name)}</div><div class="grow"><b>${esc(x.c.name)}</b><small>${x.n} ta qarz</small></div><div class="amt">${fmt(x.s)}</div></div>`).join("")}</div>`}
else if(v=="notif")h=hd("Bildirishnomalar","home")+`<div class="card">${S.notif.map(n=>`<div class="row"><div class="av" style="background:${n.k=="r"?"#5a1d26":"#5a4410"}">${ic(n.k=="r"?"alert":"clock",18)}</div><div class="grow"><b style="white-space:normal">${esc(n.t)}</b></div></div>`).join("")}</div><div class="note">Demo: WhatsApp/SMS yuborish haqiqiy emas.</div>`;
else if(v=="chat")h=hd("Qoʻllab-quvvatlash","profile")+chatBox(1,0);
else if(v=="profile")h=hd("Profil")+`<div class="card" style="text-align:center"><div class="av" style="width:64px;height:64px;margin:0 auto 8px;font-size:22px">BM</div><b>Baraka Market</b><br><small style="color:var(--m)">Rustam Aliyev · +998 90 111 22 33</small><div style="margin-top:8px"><span class="tag">Obuna: 2027-01-12 gacha</span></div></div><div class="card"><button class="btn w" style="margin-bottom:8px" data-a="go" data-v="chat">${ic("chat",18)} Adminga yozish</button><button class="btn o w" style="margin-bottom:8px" data-a="go" data-v="ops">${ic("doc",18)} Operatsiyalar tarixi</button><button class="btn o w" data-a="reset">${ic("refresh",18)} Demo ma’lumotlarni tiklash</button></div><div class="note">Bu demo-prototip: maʼlumotlar faqat brauzer xotirasida, serverga saqlanmaydi.</div>`;
const main=["home","clients","debts","stats","profile"],act=v=="client"?"clients":v=="debtd"?"debts":["ops","notif","chat"].includes(v)?(v=="chat"?"profile":"home"):v;
return`<div class="phone"><div class="scr">${h}</div><div class="nav">${[["home",ic("home"),"Bosh"],["clients",ic("users"),"Mijozlar"],["debts",ic("card"),"Qarzlar"],["stats",ic("chart"),"Statistika"],["profile",ic("gear"),"Profil"]].map(x=>`<button class="${act==x[0]?"on":""}" data-a="go" data-v="${x[0]}"><i>${x[1]}</i>${x[2]}</button>`).join("")}</div>${S.modal&&S.mode=="store"?modal():""}</div>`}

function chatBox(sid,me){const m=S.chat[sid]||[];return`<div class="card"><div class="msgs" id="ms">${m.map(x=>`<div class="bub ${x.me==me?"me":""}">${esc(x.t)}<small>${x.h}${x.me==me?" · "+ic("check",11)+" oʻqildi":""}</small></div>`).join("")||"<small>Xabar yoʻq</small>"}</div><div style="display:flex;gap:8px;margin-top:10px"><input id="msg" placeholder="Xabar yozing..." style="margin:0"><button class="btn" data-a="send" data-v="${sid}:${me}">${ic("send",18)}</button></div></div>`}

function modal(){const m=S.modal,cs=S.clients.map(c=>`<option value="${c.id}" ${m.cid==c.id?"selected":""}>${esc(c.name)}</option>`).join("");
let b="";if(m.t=="client")b=`<h3>Yangi mijoz</h3><br><label>Ism va familiya</label><input id="f1" placeholder="Masalan: Anvar Ergashev"><label>Telefon</label><input id="f2" value="+998 " inputmode="tel"><button class="btn w" data-a="saveClient">Saqlash</button>`;
if(m.t=="debt")b=`<h3>${m.id?"Qarzni tahrirlash":"Yangi qarz"}</h3><br><label>Mijoz</label><select id="f1" ${m.id?"disabled":""}>${cs}</select><label>Summa (soʻm)</label><input id="f2" type="number" inputmode="numeric" value="${m.amount||""}" placeholder="500000"><label>Qaytarish muddati</label><input id="f3" type="date" value="${m.due||addD(T,14)}"><label>Izoh</label><input id="f4" value="${esc(m.note||"")}"><button class="btn w" data-a="saveDebt" data-v="${m.id||""}">Saqlash</button>`;
if(m.t=="pay"){const d=S.debts.find(x=>x.id==m.id);b=`<h3>Toʻlov yozish</h3><small style="color:var(--m)">${esc(cl(d.cid).name)} · qoldiq ${fmt(rem(d))}</small><br><br><label>Summa</label><input id="f1" type="number" inputmode="numeric" placeholder="Qisman toʻlov"><div style="display:flex;gap:8px;margin-bottom:10px"><button class="chip" data-a="fill" data-v="${rem(d)}">To‘liq yopish</button><button class="chip" data-a="fill" data-v="${Math.round(rem(d)/2)}">Yarmi</button></div><label>Sana</label><input id="f2" type="date" value="${T}"><button class="btn w" data-a="savePay" data-v="${d.id}">Yozish</button>`}
return`<div class="ov ${S.mode=="admin"?"adm":""}" data-a="close"><div class="sheet" onclick="event.stopPropagation()">${b}</div></div>`}

const stl={active:["Faol",""],blocked:["Bloklangan","r"],expired:["Tugagan","a"],pending:["Toʻlov kutilmoqda","x"]};
const shopSt=s=>`<span class="tag ${stl[s.st][1]}">${stl[s.st][0]}</span>`;
function admin(){const t=S.tab,sh=S.shops,rev=S.paid.reduce((s,p)=>s+p.amt,0);let h="";
if(t=="dash")h=`<div class="kp"><div class="mini"><small>Doʻkonlar</small><b>${sh.length}</b></div><div class="mini"><small>Faol</small><b class="pos">${sh.filter(s=>s.st=="active").length}</b></div><div class="mini"><small>Bloklangan</small><b class="neg">${sh.filter(s=>s.st=="blocked").length}</b></div><div class="mini"><small>Obunalardan daromad</small><b>${fmt(rev)}</b></div><div class="mini"><small>Yangi (30 kun)</small><b>${sh.filter(s=>dd(T,s.reg)<=30).length}</b></div></div><div class="two"><div class="card"><h3>Daromad, mln soʻm (demo)</h3>${bars(S.rev,["Iyn","Iyl","Avg","Sen","Okt","Noy","Dek*"])}</div><div class="card"><h3>Obuna holati</h3><div style="display:flex;gap:14px;align-items:center">${donut(["active","expired","blocked","pending"].map(k=>sh.filter(s=>s.st==k).length),["#22e07a","#f5b942","#ff5d6c","#7fa594"])}<div style="font-size:13px;line-height:1.9">${Object.keys(stl).map(k=>`${stl[k][0]}: <b>${sh.filter(s=>s.st==k).length}</b>`).join("<br>")}</div></div></div></div><div class="card"><h3>Kutilayotgan toʻlovlar: ${S.pend.length}</h3><button class="btn s" data-a="atab" data-v="pay">Tekshirishga oʻtish</button></div>`;
else if(t=="shops"){const l=sh.filter(s=>S.sf=="all"||s.st==S.sf);h=`<div class="chips">${[["all","Hammasi"],["active","Faol"],["blocked","Bloklangan"],["expired","Tugagan"],["pending","Kutilmoqda"]].map(x=>`<button class="chip ${S.sf==x[0]?"on":""}" data-a="sf" data-v="${x[0]}">${x[1]}</button>`).join("")}</div><div class="card tw"><table><tr><th>Doʻkon</th><th>Egasi</th><th>Telefon</th><th>Tarif</th><th>Tugash</th><th>Holat</th><th></th></tr>${l.map(s=>`<tr><td><b>${esc(s.name)}</b><br><small style="color:var(--m)">${esc(s.city)}</small></td><td>${esc(s.owner)}</td><td>${s.phone}</td><td>${s.plan} oy</td><td>${s.end}</td><td>${shopSt(s)}</td><td><button class="btn o s" data-a="shop" data-v="${s.id}">Batafsil</button></td></tr>`).join("")}</table></div>`}
else if(t=="subs")h=`<div class="card"><h3>Tariflar (admin oʻzgartira oladi)</h3><div class="two">${S.tariffs.map((x,i)=>`<div class="mini"><label>Muddat (oy)</label><input id="tm${i}" type="number" value="${x.m}"><label>Narx (soʻm)</label><input id="tp${i}" type="number" value="${x.p}"><small>${fmt(x.p)} / ${x.m} oy</small>${i>0?`<br><span class="tag">Chegirma −${Math.round((1-x.p/(S.tariffs[0].p*x.m/S.tariffs[0].m))*100)}%</span>`:""}</div>`).join("")}</div><button class="btn" style="margin-top:10px" data-a="saveTar">Saqlash</button></div><div class="card tw"><h3>Obunalar</h3><table><tr><th>Doʻkon</th><th>Tarif</th><th>Tugash</th><th>Qoldi</th><th>Uzaytirish</th></tr>${sh.map(s=>{const k=dd(s.end,T);return`<tr><td><b>${esc(s.name)}</b></td><td>${s.plan} oy</td><td>${s.end}</td><td class="${k<0?"neg":k<=5?"warn":"pos"}">${k<0?"tugagan":k+" kun"}</td><td>${S.tariffs.map((x,i)=>`<button class="btn o s" data-a="ext" data-v="${s.id}:${i}">+${x.m} oy</button>`).join(" ")}</td></tr>`}).join("")}</table></div>`;
else if(t=="pay")h=`<div class="note">Qoʻlda tekshirish rejimi: toʻlov haqiqiy tizimga ulanmagan, admin tasdiqlaydi.</div><div class="card"><h3>Kutilayotgan toʻlovlar</h3>${S.pend.map(p=>{const s=sh.find(x=>x.id==p.shop);return`<div class="row"><div class="grow"><b>${esc(s.name)}</b><small>${p.date} · ${p.ref}</small></div><div class="amt">${fmt(p.amt)}</div><button class="btn s" data-a="okPay" data-v="${p.id}">${ic("check",16)}</button><button class="btn d s" data-a="noPay" data-v="${p.id}">${ic("x",16)}</button></div>`}).join("")||"<small>Hammasi tekshirilgan</small>"}</div><div class="card"><h3>Tasdiqlangan toʻlovlar</h3>${S.paid.map(p=>`<div class="row"><div class="grow"><b>${esc(sh.find(x=>x.id==p.shop).name)}</b><small>${p.date}</small></div><div class="amt pos">${fmt(p.amt)}</div></div>`).join("")}</div>`;
else if(t=="chat")h=`<div class="chat"><div class="card" style="padding:6px">${sh.filter(s=>S.chat[s.id]).map(s=>`<div class="row cl" data-a="thread" data-v="${s.id}" style="padding:10px;border-radius:10px;${S.sel==s.id?"background:var(--c2)":""}"><div class="av">${ini(s.name)}</div><div class="grow"><b>${esc(s.name)}</b><small>${esc(S.chat[s.id].slice(-1)[0].t)}</small></div></div>`).join("")}</div><div><h3 style="margin-bottom:8px">${esc(sh.find(x=>x.id==S.sel).name)}</h3>${chatBox(S.sel,1)}<small style="color:var(--m)">Baraka Market bilan chat Store App → Profil’da ham koʻrinadi.</small></div></div>`;
else if(t=="rev"){const m=[["Iyn",1.4],["Iyl",1.9],["Avg",2.5],["Sen",3.1],["Okt",4.3],["Noy",rev/1e6+2.2]];h=`<div class="kp"><div class="mini"><small>Oylik daromad</small><b>${fmt(rev+2200000)}</b></div><div class="mini"><small>Oʻrtacha chek</small><b>${fmt(S.paid.reduce((s,p)=>s+p.amt,0)/S.paid.length)}</b></div><div class="mini"><small>Faol obunalar</small><b>${sh.filter(s=>s.st=="active").length}</b></div></div><div class="card"><h3>Daromad dinamikasi, mln soʻm</h3>${bars(m.map(x=>+x[1].toFixed(1)),m.map(x=>x[0]))}</div><div class="card"><h3>Tariflar ulushi</h3>${S.tariffs.map(x=>{const n=sh.filter(s=>s.plan==x.m).length;return`<div style="margin-bottom:10px"><small>${x.m} oy — ${n} doʻkon</small><div class="bar"><i style="width:${n/sh.length*100}%"></i></div></div>`}).join("")}</div>`}
else h=`<div class="card"><h3>Sozlamalar</h3><label>Administrator</label><input value="Bosh administrator" disabled><label>Obuna tugashidan oldin ogohlantirish (kun)</label><input type="number" value="5" disabled><div class="note">Demo: xavfsizlik, rollar va audit jurnali serverda amalga oshiriladi.</div><button class="btn o" data-a="reset">${ic("refresh",18)} Demo ma’lumotlarni tiklash</button></div><div class="card"><h3>Audit jurnali (demo)</h3>${sh.flatMap(s=>s.log.map(l=>`<div class="row"><div class="grow"><b style="white-space:normal">${esc(l)}</b><small>${esc(s.name)}</small></div></div>`)).slice(0,8).join("")}</div>`;
const tabs=[["dash",ic("grid",18)+" Dashboard"],["shops",ic("shop",18)+" Doʻkonlar"],["subs",ic("key",18)+" Obunalar/Tariflar"],["pay",ic("check",18)+" Toʻlovlar"],["chat",ic("chat",18)+" Chat"],["rev",ic("wallet",18)+" Daromad"],["set",ic("gear",18)+" Sozlamalar"]];
return`<div class="adm-w"><div class="side">${tabs.map(x=>`<button class="${t==x[0]?"on":""}" data-a="atab" data-v="${x[0]}">${x[1]}</button>`).join("")}</div><div>${h}</div></div>${S.modal&&S.mode=="admin"?shopModal():""}`}
function shopModal(){const s=S.shops.find(x=>x.id==S.modal.id);return`<div class="ov adm" data-a="close"><div class="sheet" onclick="event.stopPropagation()"><h3>${esc(s.name)} ${shopSt(s)}</h3><p style="font-size:14px;line-height:1.8;margin:10px 0">Egasi: ${esc(s.owner)}<br>Tel: ${s.phone}<br>Shahar: ${esc(s.city)}<br>Roʻyxatdan oʻtgan: ${s.reg}<br>Tarif: ${s.plan} oy · tugash: ${s.end}</p><h3 style="font-size:13px;color:var(--m)">Faollik tarixi</h3>${s.log.map(l=>`<div class="row"><small>${esc(l)}</small></div>`).join("")}<div style="display:flex;gap:8px;margin-top:12px">${s.st=="blocked"?`<button class="btn w" data-a="setSt" data-v="${s.id}:active">Blokdan chiqarish</button>`:`<button class="btn d w" data-a="setSt" data-v="${s.id}:blocked">Bloklash</button>`}${s.st=="pending"?`<button class="btn w" data-a="setSt" data-v="${s.id}:active">Faollashtirish</button>`:""}</div></div></div>`}

function render(){$("#b1").innerHTML=ic("phone",16)+" Store App";$("#b2").innerHTML=ic("shield",16)+" Admin";document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.v==S.mode));$("#app").innerHTML=S.mode=="store"?store():admin();const m=$("#ms");if(m)m.scrollTop=m.scrollHeight}
const val=i=>($("#"+i)||{}).value;
const A={
mode(v){S.mode=v;S.modal=null},go(v){S.view=v;S.modal=null;S.q=""},tab:0,atab(v){S.tab=v;S.modal=null},
client(v){S.cid=+v;S.view="client"},debt(v){S.did=+v;S.view="debtd"},fl(v){S.fl=v},opf(v){S.ops=v},sf(v){S.sf=v},close(){S.modal=null},
addClient(){S.modal={t:"client"}},addDebt(v){S.modal={t:"debt",cid:v}},
editDebt(v){const d=S.debts.find(x=>x.id==v);S.modal={t:"debt",id:d.id,cid:d.cid,amount:d.amount,due:d.due,note:d.note}},
pay(v){S.modal={t:"pay",id:+v}},fill(v){$("#f1").value=v;return 1},
saveClient(){const n=val("f1").trim(),p=val("f2").trim();if(n.length<3||p.length<12){toast("Ism va telefonni toʻliq kiriting");return 1}S.clients.push({id:++S.uid,name:n,phone:p});S.modal=null;toast("Mijoz qoʻshildi")},
saveDebt(v){const a=+val("f2"),du=val("f3");if(!(a>0)||!du){toast("Summa va muddatni kiriting");return 1}
if(v){const d=S.debts.find(x=>x.id==v);if(a<paidOf(d)){toast("Summa toʻlangandan kam boʻlmasin");return 1}d.amount=a;d.due=du;d.note=val("f4");d.ed++}else S.debts.push({id:++S.uid,cid:+val("f1"),amount:a,date:T,due:du,note:val("f4")||"Qarz",ed:0,pays:[]});S.modal=null;toast(v?"Qarz yangilandi":"Qarz qoʻshildi")},
savePay(v){const d=S.debts.find(x=>x.id==v),a=+val("f1");if(!(a>0)||a>rem(d)){toast("Summa 0 dan katta va qoldiqdan oshmasligi kerak");return 1}d.pays.push({id:++S.uid,amt:a,date:val("f2")||T});S.modal=null;toast(rem(d)<=0?"Qarz toʻliq yopildi":"Qisman toʻlov yozildi")},
void(v){const[d,p]=v.split(":").map(Number);S.debts.find(x=>x.id==d).pays.find(x=>x.id==p).void=true;toast("Bekor qilindi, tarix saqlandi")},
remind(v){toast("Demo: eslatma yuborildi (haqiqiy emas)");return 1},reset(){S=seed();toast("Demo tiklandi")},
send(v){const[s,me]=v.split(":").map(Number),t=val("msg").trim();if(!t)return 1;(S.chat[s]=S.chat[s]||[]).push({me,t,h:"hozir"});if(me==0)setTimeout(()=>{S.chat[s].push({me:1,t:"Xabaringiz uchun rahmat, tez orada javob beramiz.",h:"hozir"});render()},1200)},
thread(v){S.sel=+v},shop(v){S.modal={id:+v}},
setSt(v){const[i,st]=v.split(":"),s=S.shops.find(x=>x.id==i);s.st=st;s.log.unshift(st=="blocked"?"Admin tomonidan bloklandi":"Admin tomonidan faollashtirildi");S.modal=null;toast(st=="blocked"?"Doʻkon bloklandi":"Doʻkon faol")},
ext(v){const[i,k]=v.split(":"),s=S.shops.find(x=>x.id==i),tr=S.tariffs[k],b=s.end>T?s.end:T;const d=new Date(b);d.setMonth(d.getMonth()+tr.m);s.end=d.toISOString().slice(0,10);s.plan=tr.m;if(s.st=="expired"||s.st=="pending")s.st="active";S.paid.unshift({shop:s.id,amt:tr.p,date:T});s.log.unshift("Obuna uzaytirildi: +"+tr.m+" oy");toast("Obuna uzaytirildi")},
saveTar(){S.tariffs=S.tariffs.map((x,i)=>({m:+val("tm"+i)||x.m,p:+val("tp"+i)||x.p}));toast("Tariflar saqlandi")},
okPay(v){const p=S.pend.find(x=>x.id==v),s=S.shops.find(x=>x.id==p.shop);S.pend=S.pend.filter(x=>x!=p);S.paid.unshift({shop:s.id,amt:p.amt,date:T});const m=S.tariffs.find(t=>t.p==p.amt)||S.tariffs[0],d=new Date(s.end>T?s.end:T);d.setMonth(d.getMonth()+m.m);s.end=d.toISOString().slice(0,10);s.st="active";s.log.unshift("Toʻlov tasdiqlandi");toast("Toʻlov tasdiqlandi, obuna faol")},
noPay(v){S.pend=S.pend.filter(x=>x.id!=v);toast("Toʻlov rad etildi")}};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const f=A[el.dataset.a];if(typeof f!="function")return;if(f(el.dataset.v)===1&&el.dataset.a!="send")return;render()});
document.addEventListener("input",e=>{if(e.target.id=="q"){S.q=e.target.value;$("#cl").innerHTML=clRows()}});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="msg"){const b=e.target.parentNode.querySelector("[data-a=send]");b&&b.click()}});
render();
</script></body></html>
