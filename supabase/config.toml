# Minimal local config. Run `supabase init` once if you prefer the generated full file.
project_id = "qarzdaftar"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
